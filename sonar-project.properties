sonar.projectKey=ApliKasir-Codebase_ApliKasir-Website
sonar.organization=aplikasir-codebase
sonar.projectName=ApliKasir-Website

# Source configuration
sonar.sources=app,resources/js
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions — skip vendor, node_modules, and build artifacts
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,*.blade.php

# PHP settings
sonar.php.file.suffixes=php

# JavaScript/JSX settings
sonar.javascript.file.suffixes=.js,.jsx
